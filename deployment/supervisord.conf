[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/logs/nginx.stdout.log
stderr_logfile=/app/logs/nginx.stderr.log
priority=10

[program:gateway]
command=node /app/gateway/server.js
directory=/app/gateway
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="8000"
stdout_logfile=/app/logs/gateway.stdout.log
stderr_logfile=/app/logs/gateway.stderr.log
priority=20

[program:mycelium]
command=python -m flask run --host=0.0.0.0 --port=8100
directory=/app/mycelium
environment=FLASK_APP="main.py",FLASK_ENV="production",PORT="8100"
autostart=true
autorestart=true
stdout_logfile=/app/logs/mycelium.stdout.log
stderr_logfile=/app/logs/mycelium.stderr.log
priority=30

[group:services]
programs=nginx,gateway,mycelium
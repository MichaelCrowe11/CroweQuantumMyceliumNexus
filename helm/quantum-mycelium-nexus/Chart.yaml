apiVersion: v2
name: quantum-mycelium-nexus
description: A Helm chart for QuantumMycelium Nexus - Hybrid quantum-classical computing platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/crowelogic/quantum-mycelium-nexus
sources:
  - https://github.com/crowelogic/quantum-mycelium-nexus
maintainers:
  - name: Crowe Logic
    email: support@crowelogic.com
    url: https://crowelogic.com
keywords:
  - quantum-computing
  - mycelium
  - artificial-intelligence
  - biotechnology
  - ecology
  - hybrid-computing
annotations:
  category: Science & Technology
  licenses: Proprietary
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: rabbitmq
    version: "11.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  - name: prometheus
    version: "23.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
  - name: jaeger
    version: "0.71.x"
    repository: https://jaegertracing.github.io/helm-charts
    condition: tracing.jaeger.enabled
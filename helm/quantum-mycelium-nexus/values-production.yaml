# Production deployment values for QuantumMycelium Nexus
# Optimized for high availability, security, and performance

global:
  environment: production
  imageRegistry: "ghcr.io/michaelcrowe11"
  imageTag: "v1.0.0"
  domain: "mycelium-ei.io"
  
  # Security configuration
  security:
    enabled: true
    tls:
      enabled: true
      secretName: mycelium-ei-tls
    authentication:
      enabled: true
      provider: oauth2
      github:
        enabled: true
        clientId: "${GITHUB_CLIENT_ID}"
        clientSecret: "${GITHUB_CLIENT_SECRET}"
      google:
        enabled: true
        clientId: "${GOOGLE_CLIENT_ID}"
        clientSecret: "${GOOGLE_CLIENT_SECRET}"
    
  # Monitoring and observability
  monitoring:
    prometheus:
      enabled: true
    grafana:
      enabled: true
    jaeger:
      enabled: true
    alerts:
      enabled: true

# Mycelium Runtime - Core language execution engine
myceliumRuntime:
  replicaCount: 3
  image:
    repository: "mycelium-runtime"
    tag: "v1.0.0"
    
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
      
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    
  service:
    type: ClusterIP
    port: 8200
    
  env:
    LOG_LEVEL: "info"
    QUANTUM_BACKEND: "ibm"
    MAX_QUBITS: "64"
    CIRCUIT_TIMEOUT: "300"

# Quantum Compute Service - Quantum circuit execution
quantumCompute:
  replicaCount: 2
  image:
    repository: "quantum-compute"
    tag: "v1.0.0"
    
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
      
  service:
    type: ClusterIP
    port: 8100
    
  env:
    QUANTUM_PROVIDERS: "ibm,google,aws"
    MAX_CIRCUIT_DEPTH: "1000"
    SIMULATION_SHOTS: "8192"

# Orchestrator - API Gateway and coordination
orchestrator:
  replicaCount: 3
  image:
    repository: "orchestrator"
    tag: "v1.0.0"
    
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
      
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
    
  service:
    type: ClusterIP
    port: 8300
    
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rate-limit: "1000"
    hosts:
      - host: api.mycelium-ei.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-mycelium-ei-tls
        hosts:
          - api.mycelium-ei.io

# Frontend - Web interface and IDE
frontend:
  replicaCount: 3
  image:
    repository: "frontend"
    tag: "v1.0.0"
    
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
      
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    
  service:
    type: ClusterIP
    port: 3000
    
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: mycelium-ei.io
        paths:
          - path: /
            pathType: Prefix
      - host: www.mycelium-ei.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: mycelium-ei-tls
        hosts:
          - mycelium-ei.io
          - www.mycelium-ei.io
          
  env:
    NODE_ENV: "production"
    REACT_APP_API_URL: "https://api.mycelium-ei.io"
    REACT_APP_ANALYTICS_ID: "${GOOGLE_ANALYTICS_ID}"
    REACT_APP_SENTRY_DSN: "${SENTRY_DSN}"

# ML Models Service - Machine learning integration
mlModels:
  replicaCount: 2
  image:
    repository: "ml-models"
    tag: "v1.0.0"
    
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
      
  service:
    type: ClusterIP
    port: 8400
    
  env:
    MODEL_CACHE_SIZE: "10GB"
    GPU_ENABLED: "false"  # Enable if GPU nodes available

# PostgreSQL Database
postgresql:
  enabled: true
  auth:
    postgresPassword: "${POSTGRES_PASSWORD}"
    database: "mycelium_nexus"
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "ssd"
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  metrics:
    enabled: true

# Redis Cache
redis:
  enabled: true
  auth:
    enabled: true
    password: "${REDIS_PASSWORD}"
  master:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  metrics:
    enabled: true

# Prometheus Monitoring
prometheus:
  enabled: true
  server:
    global:
      scrape_interval: 30s
      retention: 15d
    persistentVolume:
      enabled: true
      size: 100Gi
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  alertmanager:
    enabled: true
    persistentVolume:
      enabled: true
      size: 10Gi

# Grafana Dashboards
grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  persistence:
    enabled: true
    size: 10Gi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: grafana.mycelium-ei.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: grafana-mycelium-ei-tls
        hosts:
          - grafana.mycelium-ei.io
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# Jaeger Tracing
jaeger:
  enabled: true
  storage:
    type: elasticsearch
  collector:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  query:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: jaeger.mycelium-ei.io
      tls:
        - secretName: jaeger-mycelium-ei-tls
          hosts:
            - jaeger.mycelium-ei.io

# Cert Manager for TLS
cert-manager:
  enabled: true
  installCRDs: true

# Nginx Ingress Controller
nginx-ingress:
  enabled: true
  controller:
    replicaCount: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/do-loadbalancer-name: "mycelium-ei-lb"
        service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
        service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/healthz"
        service.beta.kubernetes.io/do-loadbalancer-size: "lb-small"

# Network Policies for Security
networkPolicies:
  enabled: true
  
# Pod Disruption Budgets
podDisruptionBudgets:
  enabled: true
  minAvailable: 1

# Resource Quotas
resourceQuotas:
  enabled: true
  requests:
    cpu: 20
    memory: 40Gi
  limits:
    cpu: 40
    memory: 80Gi

# Security Contexts
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
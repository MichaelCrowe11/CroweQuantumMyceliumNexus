[package]
name = "mycelium-ei-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Mycelium-EI language dependencies
mycelium-compiler = { path = "../../../mycelium-ei-lang/compiler" }
mycelium-runtime = { path = "../../../mycelium-ei-lang/runtime" }
mycelium-stdlib = { path = "../../../mycelium-ei-lang/stdlib" }

# Quantum integration
quantum-core = { path = "../quantum-core" }
quantum-compute = { path = "../quantum-compute" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Network communication
tonic = "0.10"
prost = "0.12"

# Data processing
ndarray = "0.15"
nalgebra = "0.32"

[build-dependencies]
tonic-build = "0.10"

[features]
default = ["quantum-acceleration"]
quantum-acceleration = []
debug-mode = []
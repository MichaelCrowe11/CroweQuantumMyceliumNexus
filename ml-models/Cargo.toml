[package]
name = "quantum-mycelium-ml"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core ML frameworks
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
tch = "0.13"  # PyTorch bindings
ndarray = "0.15"
nalgebra = "0.32"

# Quantum ML
pennylane-lightning = { version = "0.32", optional = true }
qiskit-aer = { version = "0.12", optional = true }

# Data processing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
polars = { version = "0.35", features = ["lazy", "temporal", "strings"] }
arrow2 = { version = "0.18", features = ["io_parquet"] }

# Async and HTTP
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

# Scientific computing
linfa = "0.7"
linfa-clustering = "0.7"
linfa-linear = "0.7"
linfa-svm = "0.7"
smartcore = "0.3"

# Image processing for visualization
image = "0.24"
imageproc = "0.23"

# Statistics and optimization
statrs = "0.16"
argmin = "0.8"
argmin-math = "0.3"

# Serialization and compression
bincode = "1.3"
flate2 = "1.0"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Integration with main project
mycelium-ei-integration = { path = "../integration/mycelium-ei-integration" }

[features]
default = ["quantum-ml", "neural-networks", "clustering"]
quantum-ml = ["pennylane-lightning", "qiskit-aer"]
neural-networks = []
clustering = []
reinforcement-learning = []
time-series = []

[[bin]]
name = "model-trainer"
path = "src/bin/model_trainer.rs"

[[bin]]
name = "inference-server"
path = "src/bin/inference_server.rs"
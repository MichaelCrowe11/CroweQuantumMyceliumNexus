[package]
name = "quantum-mycelium-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core testing
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-test = "0.4"

# Test frameworks
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
mockall = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP testing
reqwest = { version = "0.11", features = ["json"] }
wiremock = "0.6"

# Database testing
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Quantum simulation for testing
ndarray = "0.15"
num-complex = "0.4"

# Logging for tests
tracing = "0.1"
tracing-test = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system testing
tempfile = "3.8"
assert_fs = "1.1"

# Network testing
testcontainers = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Test data generation
fake = { version = "2.9", features = ["derive", "chrono"] }
rand = "0.8"

# Integration with main project
mycelium-ei-integration = { path = "../integration/mycelium-ei-integration" }

[[bin]]
name = "test-runner"
path = "src/bin/test_runner.rs"

[[bench]]
name = "quantum_benchmarks"
harness = false

[[bench]]
name = "mycelium_benchmarks"
harness = false

[[bench]]
name = "integration_benchmarks"
harness = false